services:
  api:
    image: hashicorp/http-echo:1.0.0
    command: ["-text=lab-api", "-listen=:8080"]
    ports:
      - "18080:8080"
    labels:
      nexus.project: "lab"
      nexus.service: "api"
  web:
    image: nginx:alpine
    ports:
      - "18081:80"
    labels:
      nexus.project: "lab"
      nexus.service: "web"
