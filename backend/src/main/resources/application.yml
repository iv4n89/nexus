spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus}
    username: ${DATABASE_USERNAME:nexus}
    password: ${DATABASE_PASSWORD:nexus}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
nexus:
  docker:
    host: ${DOCKER_HOST:unix:///var/run/docker.sock}
  manifest:
    allowed-root: ${NEXUS_MANIFEST_ROOT:/home/ibetanzos/dev/nexus_project/projects}
  alerts:
    enabled: true
    interval-ms: 30000
    log-window-seconds: 120
  retention:
    activity-days: 30
    deployment-events-days: 30
    fingerprint-days: 90
    cron: "0 0 3 * * *"
