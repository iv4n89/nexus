server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus}
    username: ${DATABASE_USERNAME:nexus}
    password: ${DATABASE_PASSWORD:nexus}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
logging:
  level:
    org.apache.catalina.connector.ClientAbortException: OFF
    org.springframework.web.context.request.async.AsyncRequestNotUsableException: OFF
    org.mongodb: ERROR
nexus:
  version: ${NEXUS_VERSION:0.0.1-SNAPSHOT}
  docker:
    host: ${DOCKER_HOST:unix:///var/run/docker.sock}
  manifest:
    allowed-root: ${NEXUS_MANIFEST_ROOT:/home/ibetanzos/dev/nexus_project/projects}
  alerts:
    enabled: true
    interval-ms: 30000
    log-window-seconds: 120
  logs:
    analysis-enabled: true
  retention:
    activity-days: 30
    deployment-events-days: 30
    fingerprint-days: 90
    cron: "0 0 3 * * *"
  github:
    client-id: ${NEXUS_GITHUB_CLIENT_ID:}
    client-secret: ${NEXUS_GITHUB_CLIENT_SECRET:}
    redirect-uri: ${NEXUS_GITHUB_REDIRECT_URI:}
    # H4: optional stub sync every 15 minutes (disabled by default)
    sync-enabled: ${NEXUS_GITHUB_SYNC_ENABLED:false}
    sync-cron: ${NEXUS_GITHUB_SYNC_CRON:0 */15 * * * *}
  secrets:
    key: ${NEXUS_SECRETS_KEY:}
  backup:
    enabled: ${NEXUS_BACKUP_ENABLED:false}
    scheduler-enabled: ${NEXUS_BACKUP_SCHEDULER_ENABLED:false}
    local-path: ${NEXUS_BACKUP_LOCAL_PATH:/var/lib/nexus/backups}
    pg-dump-executable: ${NEXUS_PG_DUMP_EXECUTABLE:pg_dump}
    # H4: daily backups at 03:00 UTC
    cron: ${NEXUS_BACKUP_CRON:0 0 3 * * *}
  security:
    trivy:
      enabled: ${NEXUS_TRIVY_ENABLED:false}
      scheduler-enabled: ${NEXUS_TRIVY_SCHEDULER_ENABLED:false}
      executable: ${NEXUS_TRIVY_EXECUTABLE:trivy}
      mode: ${NEXUS_TRIVY_MODE:fs}
      image-ref: ${NEXUS_TRIVY_IMAGE_REF:}
      # H4: security scans at 04:00 UTC
      cron: ${NEXUS_TRIVY_CRON:0 0 4 * * *}
  # H1: deploy pipeline orchestration — all flags OFF by default
  automation:
    security-gate-enabled: ${NEXUS_AUTOMATION_SECURITY_GATE:false}
    traffic-watch-enabled: ${NEXUS_AUTOMATION_TRAFFIC_WATCH:false}
    post-deploy-backup-enabled: ${NEXUS_AUTOMATION_POST_DEPLOY_BACKUP:false}
  terminal:
    enabled: ${NEXUS_TERMINAL_ENABLED:false}
    session-timeout-minutes: ${NEXUS_TERMINAL_TIMEOUT_MINUTES:15}
  caddy:
    enabled: ${NEXUS_CADDY_ENABLED:false}
    sites-path: ${NEXUS_CADDY_SITES_PATH:/opt/nexus/caddy/sites}
