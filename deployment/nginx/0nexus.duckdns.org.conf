# Drop this file into the edge nginx `conf.d` (ava-assistant).
# It does not replace ava-assistant.duckdns.org — that vhost stays untouched.
#
# DNS: create DuckDNS host `0nexus` → 161.97.116.30
# TLS: after HTTP works, issue a cert the same way as ava-assistant
#      (certbot -d 0nexus.duckdns.org) and reload nginx.

server {
  listen 80;
  listen [::]:80;
  server_name 0nexus.duckdns.org;

  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /actuator/health {
    proxy_pass http://127.0.0.1:8080;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
