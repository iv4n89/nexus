# Production Nexus stack. The backend mounts the Docker socket, which is
# effectively host-root equivalent (spec §8). Keep this stack off the public
# internet without authentication. Prefer group_add with the host docker gid
# instead of running the JVM as root.
#
# Required: NEXUS_ADMIN_PASSWORD, DOCKER_GID (stat -c '%g' /var/run/docker.sock).
# Path identity: host /srv/projects is bind-mounted at the same path so
# nexus.yml workingDirectory values match ProcessBuilder cwd.
# Backend uses host networking so the API can reach published project
# database ports on 127.0.0.1. Public HTTP is the edge nginx on the VPS
# (ava-assistant), vhost 0nexus.duckdns.org.
#
# VPS deploys pull GHCR images and must use `docker compose up --no-build`.
# Local: `docker compose --env-file .env up -d --build`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${NEXUS_BACKEND_IMAGE:-nexus-backend:local}
    build:
      context: ../backend
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: "127.0.0.1"
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/nexus
      DATABASE_USERNAME: nexus
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      NEXUS_ADMIN_USERNAME: ${NEXUS_ADMIN_USERNAME:-admin}
      NEXUS_ADMIN_PASSWORD: ${NEXUS_ADMIN_PASSWORD:-}
      NEXUS_MANIFEST_ROOT: /srv/projects
      NEXUS_VERSION: ${NEXUS_VERSION:-0.0.1-SNAPSHOT}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/projects:/srv/projects
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID from the host docker socket gid}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  frontend:
    image: ${NEXUS_FRONTEND_IMAGE:-nexus-frontend:local}
    build:
      context: ../frontend
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  nexus_pg:
